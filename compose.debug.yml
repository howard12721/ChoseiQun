name: choseiqun-debug

services:
  database:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: choseiqun
      MARIADB_USER: choseiqun
      MARIADB_PASSWORD: choseiqun
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: .github/docker/debug.Dockerfile
    environment:
      PORT: "8080"
      PUBLIC_BASE_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      MARIADB_URL: mysql://database:3306/choseiqun
      MARIADB_USER: choseiqun
      MARIADB_PASSWORD: choseiqun
      TRAQ_BASE_URL: "${TRAQ_BASE_URL:-https://q.trap.jp}"
      TRAQ_ORIGIN: "${TRAQ_ORIGIN:-q.trap.jp}"
      TRAQ_BOT_REQUIRED: "true"
      TRAQ_BOT_TOKEN: "${TRAQ_BOT_TOKEN:-}"
      TRAQ_BOT_ID: "${TRAQ_BOT_ID:-}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/polls"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.debug
    environment:
      VITE_BACKEND_URL: http://backend:8080
      VITE_DEBUG_TRAQ_USER: "${DEBUG_TRAQ_USER:-traP}"
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/workspace/src
      - ./frontend/public:/workspace/public
      - ./frontend/index.html:/workspace/index.html
      - ./frontend/vite.config.ts:/workspace/vite.config.ts
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  database-data:
