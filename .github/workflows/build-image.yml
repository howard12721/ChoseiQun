name: Build Docker Image

on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps: &docker-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/choseiqun
          tags: |
            type=sha,prefix=sha-
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update deploy image
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_BRANCH: ${{ github.ref == 'refs/heads/main' && 'deploy' || 'deploy-development' }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/choseiqun:sha-${{ github.sha }}
        run: |
          git fetch --no-tags origin '+refs/heads/deploy*:refs/remotes/origin/deploy*'
          if git show-ref --verify --quiet "refs/remotes/origin/$DEPLOY_BRANCH"; then
            git switch --detach "refs/remotes/origin/$DEPLOY_BRANCH"
          else
            git switch --orphan "$DEPLOY_BRANCH"
          fi

          printf 'FROM %s\n' "$IMAGE" > Dockerfile
          git add Dockerfile

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deploy: use sha-${GITHUB_SHA}"
          git push origin "HEAD:$DEPLOY_BRANCH"

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    concurrency:
      group: deploy-image-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps: *docker-steps
